<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afzal - Instagram Downloader</title>
<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:20px}
input{width:90%;padding:12px;border-radius:10px;border:none;margin:10px 0}
button{padding:12px 20px;border-radius:10px;border:none;background:#E1306C;color:#fff;font-weight:bold}
.card{background:#222;padding:15px;border-radius:15px;margin-top:15px}
img,video{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<h2>Afzal Downloader</h2>
<p>Paste Instagram Link Below</p>
<input id="link" placeholder="Paste Instagram Reel / Post Link">
<br>
<button onclick="loadData()">Get Data</button>
<div id="result"></div>

<script>
const API_KEY = "AQ.Ab8RN6KpfFOKtoPoU8Nni0X1xLG1Z1OOy_K87OcSr3dQFuWhRQ";
async function loadData(){
  let url = document.getElementById('link').value;
  document.getElementById('result').innerHTML = "Loading... ID: " + url;
  try{
    let res = await fetch(`https://graph.instagram.com/me/media?fields=id,caption,media_url,permalink&access_token=${API_KEY}`);
    let data = await res.json();
    document.getElementById('result').innerHTML = "<div class='card'><pre>"+JSON.stringify(data,null,2)+"</pre></div>";
  }catch(e){
    document.getElementById('result').innerHTML = "Error: "+e;
  }
}
</script>
</body>
</html>
