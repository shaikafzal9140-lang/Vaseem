<style>
body{font-family:Arial;padding:12px;background:#f0f0f0}
.box{background:white;padding:14px;border-radius:12px;margin-top:12px}
select,input{width:100%;padding:12px;margin:6px 0;box-sizing:border-box}
button{padding:12px 16px;border:none;border-radius:10px;margin:4px}
video{width:100%;max-width:320px;border-radius:10px;background:black;display:none}
.ans{background:#fffde7;padding:14px;border-radius:10px;line-height:1.9;margin-top:10px}
</style>
</head>
<body>
<h2>Study Saathi</h2>
<p>Class 1 to B.Tech, Diploma, UPSC - All Subjects</p>

<div class="box">
<b>1. SELECT SECTION</b>
<select id="section" onchange="loadChapters()">
<option>1st to 5th</option>
<option>6th to 8th</option>
<option>9th to 10th</option>
<option>Inter - 11th to 12th</option>
<option>Degree - All Semesters</option>
<option>B.Tech - Sem 1 to 8</option>
<option>Diploma - Sem 1 to 6</option>
<option>UPSC - IAS / IPS</option>
</select>
<b>2. SELECT CHAPTER</b>
<select id="chapter" onchange="showFormula()"></select>
<div id="formulaBox"></div>
</div>

<div class="box">
<b>3. CAMERA - Take Photo & Crop</b><br>
<button onclick="openCam('user')" style="background:#2196F3;color:white">Front Camera</button>
<button onclick="openCam('environment')" style="background:#FF9800;color:white">Back Camera</button><br><br>
<video id="cam" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas><br>
<button onclick="takePhoto()" style="background:green;color:white;width:100%">Take Photo</button>
<p id="camStatus">Camera is OFF.</p>
<img id="myPhoto" style="width:100%;display:none;border:2px solid green;border-radius:10px">
<div id="cropArea" style="display:none">
<p><b>Photo is ready. Now Crop the Question Area:</b></p>
<button onclick="cropPhoto()" style="background:#9C27B0;color:white;width:100%">✂️ Crop - Only Question Part</button>
<img id="croppedPhoto" style="width:100%;display:none;border:2px solid purple;border-radius:10px;margin-top:10px">
<p id="cropMsg" style="display:none;color:green"><b>Cropped Successfully! Now type the question below.</b></p>
</div>
</div>

<div class="box">
<b>4. TYPE YOUR QUESTION</b>
<input id="q" placeholder="Example: x^4+1=0">
<button onclick="solveManual()" style="background:#00a651;color:white;width:100%">Get Solution - Step by Step</button>
<div id="ans"></div>
</div>

let stream=null, lastPhotoData=null;
async function openCam(mode){
  let v=document.getElementById('cam'); v.style.display='block';
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode}}); v.srcObject=stream; document.getElementById('camStatus').innerHTML="Camera is ON."; }
  catch(e){ alert('Please Allow Camera - Click Lock Icon > Allow'); }
}
function takePhoto(){
  let v=document.getElementById('cam');
  if(!v.srcObject){ alert('First click Front or Back Camera'); return; }
  let canvas=document.getElementById('canvas');
  canvas.width=v.videoWidth; canvas.height=v.videoHeight;
  canvas.getContext('2d').drawImage(v,0,0);
  lastPhotoData = canvas.toDataURL();
  let img=document.getElementById('myPhoto');
  img.src=lastPhotoData; img.style.display='block';
  document.getElementById('camStatus').innerHTML="Photo Taken Successfully!";
  document.getElementById('cropArea').style.display='block';
}
